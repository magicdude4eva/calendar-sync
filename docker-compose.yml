services:
  calendar-sync:
    # Published image (see .github/workflows/docker-publish.yml).
    # `docker compose pull` fetches it; `docker compose build` builds it locally instead.
    image: ghcr.io/magicdude4eva/calendar-sync:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config.json:/app/config.json:ro
    # Arguments passed to the ENTRYPOINT defined in the Dockerfile
    command: ["--import"]
